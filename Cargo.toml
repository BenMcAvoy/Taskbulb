[package]
name = "taskbulb"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
dotenvy = "0.15"
fontdue = "0.9.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.151"
tao = "0.37.0"
tokio = { version = "1.53.1", features = ["full"] }
tray-icon = "0.25.0"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
